version: 2
updates:
  # Keep GitHub Actions current and let Dependabot propose the exact SHA pins
  # (safer than hand-pinning a digest we can't verify at authoring time).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Base images in Dockerfile are pinned by digest; let Dependabot refresh them.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
