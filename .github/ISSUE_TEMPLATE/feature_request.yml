name: Feature request
description: Propose a change to the routing rubric, protocol, or state-file format.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        TierDecay stays deliberately small: a tool-agnostic rubric, a ledger, a playbook, and thin
        adapters. Proposals that keep the moving parts few and the protocol legible are easiest to accept.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem are you hitting? What does the current protocol or rubric fail to do?
    validations:
      required: true
  - type: textarea
    id: proposed-change
    attributes:
      label: Proposed change
      description: What should change, concretely? Reference the affected file(s) (SPEC, ledger, playbook, an adapter).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you set them aside.
    validations:
      required: false
