name: CI

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact commit to validate
        required: false
        type: string
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Shellcheck & repo structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Shellcheck all shell
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          [ "${#scripts[@]}" -gt 0 ] || { echo "::error::no shell scripts found"; exit 1; }
          shellcheck "${scripts[@]}"

      - name: Run regression test suites
        run: |
          set -euo pipefail
          bash tests/test-installer.sh
          bash tests/test-routing-order.sh
          bash tests/test-guard.sh

      - name: Required files present
        run: |
          set -euo pipefail
          req=(README.md LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md \
               core/SPEC.md core/ledger.template.md core/playbook.template.md install.sh)
          for f in "${req[@]}"; do
            [ -f "$f" ] || { echo "::error::missing required file $f"; exit 1; }
          done
          echo "All required files present."

      - name: Every adapter ships a native context file
        run: |
          set -euo pipefail
          for d in adapters/*/; do
            [ -f "${d}README.md" ] || { echo "::error::${d} has no README.md"; exit 1; }
            # Exclude README.md so the check actually proves a native context
            # file (AGENTS.md/GEMINI.md/CLAUDE.md/CONVENTIONS.md) is shipped.
            if ! find "$d" -maxdepth 1 -type f -name '*.md' ! -name 'README.md' | grep -q .; then
              echo "::error::${d} ships no native context file"; exit 1
            fi
          done
          echo "All adapters complete."

      - name: README asset links resolve
        run: |
          set -euo pipefail
          for a in $(grep -oE 'assets/[A-Za-z0-9._/-]+\.(png|gif|svg|jpe?g)' README.md | sort -u); do
            [ -f "$a" ] || { echo "::error::README references missing asset $a"; exit 1; }
          done
          echo "All README asset links resolve."

      - name: Installer and guard are executable
        run: |
          set -euo pipefail
          [ -x install.sh ] || { echo "::error::install.sh is not executable (chmod +x)"; exit 1; }
          [ -x adapters/claude-code/.claude/hooks/tierdecay-guard.sh ] \
            || { echo "::error::integrity guard hook is not executable"; exit 1; }
          echo "Executables OK."

      - name: Installer is idempotent (never clobbers learned state)
        run: |
          set -euo pipefail
          # The ledger/playbook are "the product" — a reinstall must never
          # overwrite them. Regression guard for the `cp -n` coreutils >= 9.2
          # trap (exit nonzero on skip -> clobbering fallback).
          tmp="$(mktemp -d)"
          (cd "$tmp" && "$GITHUB_WORKSPACE/install.sh" claude)
          echo "LEARNED-STATE-MARKER" >> "$tmp/.claude/routing-ledger.md"
          (cd "$tmp" && "$GITHUB_WORKSPACE/install.sh" claude)
          grep -q "LEARNED-STATE-MARKER" "$tmp/.claude/routing-ledger.md" \
            || { echo "::error::reinstall clobbered .claude/routing-ledger.md"; exit 1; }
          [ -f "$tmp/.claude/routing-ledger.md.tierdecay" ] \
            || { echo "::error::expected a .tierdecay sidecar on collision"; exit 1; }
          # A reinstall must also never replace a user's hardened settings.json
          # (e.g. permissions/hooks) with the shipped default.
          printf '{"model":"fable","permissions":{"deny":["WebFetch"]}}\n' > "$tmp/.claude/settings.json"
          (cd "$tmp" && "$GITHUB_WORKSPACE/install.sh" claude)
          grep -q '"deny"' "$tmp/.claude/settings.json" \
            || { echo "::error::reinstall clobbered a hardened .claude/settings.json"; exit 1; }
          tmp2="$(mktemp -d)"
          (cd "$tmp2" && "$GITHUB_WORKSPACE/install.sh" agents)
          echo "LEARNED-STATE-MARKER" >> "$tmp2/.tierdecay/ledger.md"
          (cd "$tmp2" && "$GITHUB_WORKSPACE/install.sh" agents)
          grep -q "LEARNED-STATE-MARKER" "$tmp2/.tierdecay/ledger.md" \
            || { echo "::error::reinstall clobbered .tierdecay/ledger.md"; exit 1; }
          echo "Idempotence OK: learned state preserved, sidecars written."

      - name: Claude adapter enforcement is intact
        run: |
          set -euo pipefail
          g="adapters/claude-code/.claude/hooks/tierdecay-guard.sh"
          [ -x "$g" ] || { echo "::error::$g missing or not executable"; exit 1; }
          shellcheck -S warning "$g"
          python3 -c "import json; json.load(open('adapters/claude-code/.claude/settings.json'))"
          grep -q "tierdecay-guard.sh" adapters/claude-code/.claude/agents/executor.md \
            || { echo "::error::executor.md lost its guard hook"; exit 1; }
          grep -q "tierdecay-guard.sh" adapters/claude-code/.claude/agents/heavy-executor.md \
            || { echo "::error::heavy-executor.md lost its guard hook"; exit 1; }
          grep -q 'Edit(.claude/\*\*)' adapters/claude-code/.claude/settings.json \
            || { echo "::error::settings.json lost its ask rules"; exit 1; }
          if echo '{"tool_name":"Write","tool_input":{"file_path":".tierdecay/playbook.md"}}' | "$g" 2>/dev/null; then
            echo "::error::guard failed to block a state write"; exit 1
          fi
          if echo '{"tool_name":"Bash","tool_input":{"command":"echo x >> .claude/routing-ledger.md"}}' | "$g" 2>/dev/null; then
            echo "::error::guard failed to block a Bash state write"; exit 1
          fi
          echo '{"tool_name":"Write","tool_input":{"file_path":"src/app.py"}}' | "$g" \
            || { echo "::error::guard blocked a legitimate write"; exit 1; }
          # False-positive regressions: content may MENTION state paths as long
          # as the target path is not state (e.g. SECURITY.md's own advice to
          # add .tierdecay/ to .gitignore must be executable by an executor).
          echo '{"tool_name":"Edit","tool_input":{"file_path":".gitignore","old_string":"node_modules/","new_string":"node_modules/\n.tierdecay/"}}' | "$g" \
            || { echo "::error::guard blocked a legitimate .gitignore edit (content-only mention)"; exit 1; }
          echo '{"tool_name":"Write","tool_input":{"file_path":"README.md","content":"state lives in .tierdecay/ledger.md"}}' | "$g" \
            || { echo "::error::guard blocked a legitimate docs write (content-only mention)"; exit 1; }
          echo "Enforcement intact: guard blocks state writes (file + Bash), passes normal and content-only-mention writes."

  conformance:
    name: Protocol conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Context files under the 120-line cap
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in adapters/*/AGENTS.md adapters/*/CLAUDE.md \
                   adapters/*/GEMINI.md adapters/*/CONVENTIONS.md; do
            n=$(wc -l < "$f")
            [ "$n" -le 120 ] || { echo "::error::$f is $n lines (>120 cap)"; exit 1; }
          done
          echo "All context files within the 120-line cap."

      - name: Adapter <-> installer parity
        run: |
          set -euo pipefail
          declare -A map=( [agents-md]=agents [gemini-cli]=gemini [claude-code]=claude \
                           [aider]=aider [cline]=cline [goose]=goose [windsurf]=windsurf \
                           [cursor]=cursor )
          for d in adapters/*/; do
            name="$(basename "$d")"
            t="${map[$name]:-$name}"
            grep -qE "(^|[ (|])${t}[)|]" install.sh \
              || { echo "::error::no install.sh case arm for adapter '$name' (target '$t')"; exit 1; }
          done
          echo "Every adapter has an install.sh case arm."

      - name: No model versions outside core/MODELS.md
        run: |
          set -euo pipefail
          # Tiers are roles. A named model version anywhere else is drift waiting
          # to happen: it goes stale the day a new model ships. core/MODELS.md is
          # the single source of truth; CHANGELOG and examples/self-build are
          # historical records (rewriting them would falsify a real ledger).
          pattern='claude-(opus|sonnet|haiku|fable|mythos)-[0-9]|(Opus|Sonnet|Haiku|Fable|Mythos) [0-9]+\.?[0-9]*'
          if grep -rInE "$pattern" \
               --include='*.md' --include='*.yml' --include='*.yaml' \
               --include='*.json' --include='*.sh' . \
               | grep -v '^\./core/MODELS\.md:' \
               | grep -v '^\./CHANGELOG\.md:' \
               | grep -v '^\./examples/self-build/' \
               | grep -v '^\./\.github/workflows/ci\.yml:' ; then
            echo "::error::model version named outside core/MODELS.md (see matches above)"
            echo "::error::bind tiers by role/alias instead; update core/MODELS.md when a model ships"
            exit 1
          fi
          echo "No model versions outside core/MODELS.md."

      - name: Integrity invariants present in every non-native adapter
        run: |
          set -euo pipefail
          nonnative=(adapters/agents-md/AGENTS.md adapters/aider/CONVENTIONS.md \
                     adapters/gemini-cli/GEMINI.md adapters/cline/AGENTS.md \
                     adapters/goose/AGENTS.md adapters/windsurf/AGENTS.md \
                     adapters/cursor/AGENTS.md)
          need=("150" "QUARANTINE" "verb-object-surface" "PROTOCOL.md" "any axis maxed")
          for f in "${nonnative[@]}"; do
            for tok in "${need[@]}"; do
              grep -qF "$tok" "$f" || { echo "::error::$f is missing normative token: $tok"; exit 1; }
            done
          done
          echo "All non-native adapters carry the normative tokens."

  docs:
    name: Docs integrity (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Mermaid fences are balanced
        run: |
          set -euo pipefail
          opens=$(grep -cE '^```mermaid' README.md || true)
          closes=$(grep -cE '^```$' README.md || true)
          [ "$opens" -ge 1 ] || { echo "::error::no mermaid diagrams found in README"; exit 1; }
          [ "$closes" -ge "$opens" ] || { echo "::error::unbalanced mermaid code fences"; exit 1; }
          echo "Mermaid fences balanced ($opens diagrams)."

      - name: Internal relative links resolve
        run: |
          set -euo pipefail
          # Extract markdown links to relative paths (skip http(s), #anchors, mailto).
          miss=0
          while IFS= read -r target; do
            case "$target" in
              http*|\#*|mailto:*|"") continue ;;
            esac
            path="${target%%#*}"
            [ -n "$path" ] || continue
            [ -e "$path" ] || { echo "::error::README links to missing path: $path"; miss=1; }
          done < <(grep -oE '\]\(([^)]+)\)' README.md | sed -E 's/^\]\(([^)]+)\)$/\1/')
          [ "$miss" = 0 ] || exit 1
          echo "All internal relative links resolve."

  install-matrix:
    name: Installer ${{ matrix.target }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        target: [claude, agents, cursor, gemini, aider, cline, goose, windsurf]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Install, then re-run to prove idempotence (no clobber)
        run: |
          set -euo pipefail
          t="${{ matrix.target }}"
          scratch="$(mktemp -d)"
          cd "$scratch"

          "$GITHUB_WORKSPACE/install.sh" "$t"

          # A context file must land (at least one of the four).
          found=""
          for c in CLAUDE.md AGENTS.md GEMINI.md CONVENTIONS.md; do
            [ -f "$c" ] && found=1
          done
          [ -n "$found" ] || { echo "::error::$t: no context file installed"; exit 1; }

          # State must exist (native → .claude/, others → .tierdecay/).
          if [ "$t" = "claude" ]; then
            state=".claude/routing-ledger.md"
          else
            state=".tierdecay/ledger.md"
            [ -f ".tierdecay/playbook.md" ] || { echo "::error::$t: playbook not seeded"; exit 1; }
          fi
          [ -f "$state" ] || { echo "::error::$t: state file $state not seeded"; exit 1; }

          # THE regression guard: learned state must survive a re-install.
          echo "LEARNED_$t" >> "$state"
          "$GITHUB_WORKSPACE/install.sh" "$t"
          grep -q "LEARNED_$t" "$state" \
            || { echo "::error::$t: re-install CLOBBERED learned state ($state)"; exit 1; }

          echo "$t: install + idempotent re-install OK on ${{ matrix.os }}."
