name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin to a SHA once Dependabot proposes it

      - name: Guard tag <-> CHANGELOG <-> CITATION.cff coherence
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          grep -qE "^## \[${tag}\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no section for ${tag}"; exit 1; }
          grep -qE "^version: *${tag}\$" CITATION.cff \
            || { echo "::error::CITATION.cff version != ${tag}"; exit 1; }
          echo "Tag ${tag} matches CHANGELOG and CITATION.cff."

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "wrote $(wc -l < RELEASE_NOTES.md) lines of notes"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
