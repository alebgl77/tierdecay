<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc">
<title id="title">TierDecay state and interfaces</title>
<desc id="desc">SPEC, LEDGER and PLAYBOOK feed one advisor exposed through CLI, MCP and routing exports. The orchestrator verifies work and updates learned state.</desc>
<rect width="1120" height="550" fill="#FFFFFF"/>
<rect x="20" y="16" width="1080" height="52" fill="#2B3A4A"/><text x="40" y="34.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start" dominant-baseline="central">Three files, one learning loop</text><text x="40" y="56.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#C9D6E3" text-anchor="start" dominant-baseline="central">The protocol sets the rules. Repository history supplies the evidence.</text>
<g><rect x="35" y="108" width="320" height="182" rx="10" fill="#DDF3F2" stroke="#167B80" stroke-width="1.5"/><text x="195" y="158.1" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2D3D" text-anchor="middle" dominant-baseline="central">SPEC</text><text x="195" y="185.4" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2D3D" text-anchor="middle" dominant-baseline="central">Cold-start rules</text><text x="195" y="212.7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2D3D" text-anchor="middle" dominant-baseline="central">Score unfamiliar task classes.</text><text x="195" y="240.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2D3D" text-anchor="middle" dominant-baseline="central">Safety gates always apply.</text></g>
<g><path d="M195,290 L195,330 L560,330 L560,358" fill="none" stroke="#4D4D4D" stroke-width="1.6"/><polygon points="560.0,358.0 556.5,349.0 563.5,349.0" fill="#4D4D4D"/></g>
<g><rect x="400" y="108" width="320" height="182" rx="10" fill="#FFF0CF" stroke="#A66A12" stroke-width="1.5"/><text x="560" y="158.1" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2D3D" text-anchor="middle" dominant-baseline="central">LEDGER</text><text x="560" y="185.4" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2D3D" text-anchor="middle" dominant-baseline="central">Observed outcomes</text><text x="560" y="212.7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2D3D" text-anchor="middle" dominant-baseline="central">Record predicted and executed tiers.</text><text x="560" y="240.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2D3D" text-anchor="middle" dominant-baseline="central">Build class-specific defaults.</text></g>
<g><path d="M560,290 L560,330 L560,330 L560,358" fill="none" stroke="#4D4D4D" stroke-width="1.6"/><polygon points="560.0,358.0 556.5,349.0 563.5,349.0" fill="#4D4D4D"/></g>
<g><rect x="765" y="108" width="320" height="182" rx="10" fill="#E3F3E9" stroke="#32764B" stroke-width="1.5"/><text x="925" y="158.1" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2D3D" text-anchor="middle" dominant-baseline="central">PLAYBOOK</text><text x="925" y="185.4" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2D3D" text-anchor="middle" dominant-baseline="central">Reusable instructions</text><text x="925" y="212.7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2D3D" text-anchor="middle" dominant-baseline="central">Quote the proven steps in the brief.</text><text x="925" y="240.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2D3D" text-anchor="middle" dominant-baseline="central">Probe one tier lower, then verify.</text></g>
<g><path d="M925,290 L925,330 L560,330 L560,358" fill="none" stroke="#4D4D4D" stroke-width="1.6"/><polygon points="560.0,358.0 556.5,349.0 563.5,349.0" fill="#4D4D4D"/></g>
<g><rect x="280" y="360" width="560" height="76" rx="10" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/><text x="560" y="385.6" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1F2D3D" text-anchor="middle" dominant-baseline="central">One deterministic advisor</text><text x="560" y="410.3" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1F2D3D" text-anchor="middle" dominant-baseline="central">CLI · MCP · exported routing tables</text></g>
<text x="560" y="474.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1F2D3D" text-anchor="middle" dominant-baseline="central">Safety → quarantine → recertify → playbook → priors → rubric</text>
<text x="560" y="512.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F2D3D" text-anchor="middle" dominant-baseline="central">The orchestrator verifies outcomes and updates the ledger and playbook.</text>
